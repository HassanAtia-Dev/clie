name: Build MuMain Client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Client Windows (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            openssl_url: https://slproweb.com/download/Win64OpenSSL-4_0_2.exe
            openssl_dir: C:\Program Files\OpenSSL-Win64
          - arch: x86
            openssl_url: https://slproweb.com/download/Win32OpenSSL-4_0_2.exe
            openssl_dir: C:\Program Files (x86)\OpenSSL-Win32

    steps:
      - name: Checkout client sources from OpenMU-MuMain
        uses: actions/checkout@v4
        with:
          repository: HassanAtia-Dev/OpenMU-MuMain
          sparse-checkout: |
            client
          sparse-checkout-cone-mode: true
          submodules: recursive
          fetch-depth: 1

      - name: Sync truncated/missing sources from upstream MuMain
        shell: pwsh
        run: |
          Write-Host "Downloading upstream MuMain archive..."
          $zip = Join-Path $env:RUNNER_TEMP "mumain.zip"
          $out = Join-Path $env:RUNNER_TEMP "mumain-extract"
          Invoke-WebRequest -Uri "https://github.com/sven-n/MuMain/archive/refs/heads/main.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $srcRoot = (Get-ChildItem $out -Directory | Select-Object -First 1).FullName
          $upSource = Join-Path $srcRoot "src/source"
          $localSource = "client/src/source"

          if (-not (Test-Path $upSource)) {
            Write-Error "Upstream src/source not found"
            exit 1
          }

          # 1) dependencies (GLEW etc.)
          $depsSrc = Join-Path $srcRoot "src/dependencies"
          if (Test-Path (Join-Path $depsSrc "include/gl/glew.h")) {
            New-Item -ItemType Directory -Force -Path "client/src" | Out-Null
            if (-not (Test-Path "client/src/dependencies/include/gl/glew.h")) {
              Copy-Item -Recurse -Force $depsSrc "client/src/dependencies"
              Write-Host "Installed client/src/dependencies"
            } else {
              Write-Host "dependencies already present"
            }
          } else {
            Write-Error "upstream dependencies missing glew.h"
            exit 1
          }

          # 2) Walk all upstream source files and restore if local is missing or truncated
          $restored = 0
          $skipped = 0
          $exts = @(".cpp", ".h", ".hpp", ".c", ".cc", ".cxx")

          Get-ChildItem -Path $upSource -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($upSource.Length).TrimStart('\\', '/')
            $dest = Join-Path $localSource $rel
            $ext = $_.Extension.ToLowerInvariant()
            if ($exts -notcontains $ext) { return }

            $upLines = (Get-Content $_.FullName | Measure-Object -Line).Lines
            if ($upLines -lt 5) { return }

            $need = $false
            if (-not (Test-Path $dest)) {
              $need = $true
            } else {
              $localLines = (Get-Content $dest | Measure-Object -Line).Lines
              if ($localLines -lt [math]::Floor($upLines * 0.9)) {
                $need = $true
              }
            }

            if ($need) {
              $dir = Split-Path $dest -Parent
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              Copy-Item -Force $_.FullName $dest
              $restored++
              if ($restored -le 40) {
                Write-Host "  restore: $rel ($upLines lines)"
              }
            } else {
              $skipped++
            }
          }

          Write-Host "Restored $restored file(s) from upstream; kept $skipped local file(s)"

          # 3) Ensure Dotnet packet headers exist
          $dotnetSrc = Join-Path $upSource "Dotnet"
          $dotnetDst = Join-Path $localSource "Dotnet"
          if (Test-Path $dotnetSrc) {
            New-Item -ItemType Directory -Force -Path $dotnetDst | Out-Null
            Get-ChildItem $dotnetSrc -File | ForEach-Object {
              $dest = Join-Path $dotnetDst $_.Name
              if (-not (Test-Path $dest)) {
                Copy-Item $_.FullName $dest
                Write-Host "  + Dotnet/$($_.Name)"
              }
            }
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup CMake
        uses: lukka/get-cmake@v4.0.3
        with:
          cmakeVersion: '3.31.6'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install OpenSSL (${{ matrix.arch }})
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "openssl-setup.exe"
          Write-Host "Downloading OpenSSL for ${{ matrix.arch }}..."
          Invoke-WebRequest -Uri "${{ matrix.openssl_url }}" -OutFile $installer
          Write-Host "Silent install to ${{ matrix.openssl_dir }}..."
          $args = "/verysilent /suppressmsgboxes /sp- /DIR=`"${{ matrix.openssl_dir }}`""
          $p = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          if (-not (Test-Path "${{ matrix.openssl_dir }}\include\openssl\ssl.h")) {
            Write-Host "Listing Program Files for OpenSSL..."
            Get-ChildItem "C:\Program Files*" -Filter "*OpenSSL*" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            Get-ChildItem "${{ matrix.openssl_dir }}" -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }
            Write-Error "OpenSSL headers not found after install"
            exit 1
          }
          "OPENSSL_ROOT_DIR=${{ matrix.openssl_dir }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "OPENSSL_ROOT_DIR=${{ matrix.openssl_dir }}"
          "${{ matrix.openssl_dir }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure Client
        working-directory: client
        shell: pwsh
        env:
          OPENSSL_ROOT_DIR: ${{ matrix.openssl_dir }}
        run: |
          Write-Host "OPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR"
          cmake --preset windows-${{ matrix.arch }} -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR"

      - name: Build Client
        working-directory: client
        shell: pwsh
        run: cmake --build --preset windows-${{ matrix.arch }}-release --parallel

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuMain-${{ matrix.arch }}-Release
          path: client/out/build/windows-${{ matrix.arch }}/Release/
          if-no-files-found: warn
